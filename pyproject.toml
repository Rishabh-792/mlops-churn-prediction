[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-churn-prediction"
version = "1.0.0"
description = "Segment-aware customer churn prediction: configurable CatBoost pipelines with MLflow tracking and reproducible, checksum-pinned data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Rishabh Maheshwari" }]
keywords = ["mlops", "churn-prediction", "catboost", "mlflow", "optuna"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "catboost>=1.2.0",
    "mlflow>=2.9.0",
    "optuna>=3.0.0",
    "pyarrow>=14.0.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.20.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff==0.16.0"]

[project.urls]
Homepage = "https://github.com/Rishabh-792/mlops-churn-prediction"
Source = "https://github.com/Rishabh-792/mlops-churn-prediction"

[tool.setuptools]
packages = ["utils", "pipelines", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",   # line length is enforced by the formatter, not the linter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: exercises a full train/score cycle (still under a minute)",
]
filterwarnings = [
    "ignore::FutureWarning:mlflow.*",
    "ignore::UserWarning:mlflow.*",
]
